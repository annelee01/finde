{% extends 'core/base.html' %}
{% load i18n %}

{% block content %}

<style>
  .password-reset-container {
  max-width: 600px;
  padding: 20px;
}

ul {
  padding-bottom: 30px;
}
</style>

<div class="password-reset-container">
  <h1>{% trans "Set New Password" %}</h1>
  <form method="post">
    {% csrf_token %}
    <br>
    {{ form.as_p }}
    <button type="submit" class="button-light">{% trans "Change Password" %}</button>
  </form>
  {% endblock %}
</div>
